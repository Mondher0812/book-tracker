<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F1E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121917" media="(prefers-color-scheme: dark)">
<meta name="description" content="سجل تسليم كتاب الطالب وكتاب النشاط لطلاب الصفين التاسع والعاشر">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<style>
  html{color-scheme:light dark}
  body{margin:0;-webkit-tap-highlight-color:transparent}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<title>سجل تسليم الكتب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
  :root{
    --paper:#F4F1E9;
    --surface:#FFFFFF;
    --surface-2:#FBF9F4;
    --line:#DFD8C9;
    --line-soft:#EAE4D7;
    --ink:#1C2B27;
    --ink-2:#4E5E58;
    --ink-3:#7C8A84;
    --book:#0E7A6B;
    --book-bg:#DDF0EB;
    --work:#2B5EA8;
    --work-bg:#DDE7F6;
    --away:#8A7B62;
    --away-bg:#EDE6D8;
    --warn:#A8571C;
    --focus:#0E7A6B;
    --shadow:0 1px 2px rgba(28,43,39,.06), 0 6px 18px rgba(28,43,39,.05);
  }
  :root:not([data-theme="light"]){}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#121917;
      --surface:#1A2320;
      --surface-2:#212C28;
      --line:#31403B;
      --line-soft:#293530;
      --ink:#E9EFEC;
      --ink-2:#A8B8B2;
      --ink-3:#7B8B85;
      --book:#4FCBB4;
      --book-bg:#123A34;
      --work:#7FB0EE;
      --work-bg:#152D4A;
      --away:#C4B292;
      --away-bg:#332E22;
      --warn:#E0995A;
      --focus:#4FCBB4;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --paper:#121917;
    --surface:#1A2320;
    --surface-2:#212C28;
    --line:#31403B;
    --line-soft:#293530;
    --ink:#E9EFEC;
    --ink-2:#A8B8B2;
    --ink-3:#7B8B85;
    --book:#4FCBB4;
    --book-bg:#123A34;
    --work:#7FB0EE;
    --work-bg:#152D4A;
    --away:#C4B292;
    --away-bg:#332E22;
    --warn:#E0995A;
    --focus:#4FCBB4;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
    font-size:15px; line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  #app{direction:rtl; max-width:900px; margin:0 auto; padding:0 12px 96px}

  /* ---------- header ---------- */
  .topbar{
    position:sticky; top:0; z-index:30; background:var(--paper);
    padding-top:14px; border-bottom:1px solid var(--line-soft);
  }
  .title-row{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap}
  h1{
    font-family:"Noto Kufi Arabic","IBM Plex Sans Arabic",sans-serif;
    font-weight:700; font-size:20px; margin:0; letter-spacing:-.2px; text-wrap:balance;
  }
  .sub{color:var(--ink-3); font-size:12.5px; margin-top:3px}
  .sync{
    font-size:11.5px; padding:4px 9px; border-radius:999px; white-space:nowrap;
    border:1px solid var(--line); color:var(--ink-2); background:var(--surface);
  }
  .sync.ok{color:var(--book); border-color:color-mix(in srgb,var(--book) 35%,transparent)}
  .sync.warn{color:var(--warn); border-color:color-mix(in srgb,var(--warn) 40%,transparent)}

  .meter{margin:12px 0 4px}
  .meter-top{display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; color:var(--ink-2)}
  .meter-top b{font-family:inherit; font-size:15px; color:var(--ink); font-variant-numeric:tabular-nums}
  .bar{height:8px; background:var(--line-soft); border-radius:999px; overflow:hidden; margin-top:6px; display:flex}
  .bar span{display:block; height:100%; transition:width .25s ease}
  .bar .full{background:var(--book)}
  .bar .part{background:color-mix(in srgb,var(--work) 55%,var(--surface))}

  .stats{display:flex; gap:14px; flex-wrap:wrap; margin:10px 0 12px; font-size:12.5px; color:var(--ink-2)}
  .stats i{font-style:normal; font-variant-numeric:tabular-nums; font-weight:600; color:var(--ink)}
  .dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-inline-start:6px;vertical-align:-1px}

  /* ---------- tabs ---------- */
  .tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto; border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
    border-radius:10px; padding:7px 12px; font:inherit; font-size:13px; cursor:pointer; white-space:nowrap;
    display:flex; align-items:center; gap:7px;
  }
  .tab b{font-weight:600; color:var(--ink)}
  .tab .frac{font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums}
  .tab[aria-selected="true"]{border-color:var(--book); background:var(--book-bg); color:var(--ink)}
  .tab[aria-selected="true"] .frac{color:var(--book)}

  .toolrow{display:flex; gap:8px; padding-bottom:10px; align-items:center}
  .search{
    flex:1; min-width:0; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:10px; padding:9px 12px; font:inherit; font-size:14px;
  }
  .search::placeholder{color:var(--ink-3)}
  .selwrap{position:relative; flex:0 0 auto}
  select.filter{
    appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:10px; padding:9px 30px 9px 12px; font:inherit; font-size:13.5px; cursor:pointer;
  }
  .selwrap::after{content:"▾"; position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-3); pointer-events:none; font-size:11px}
  :where(button,input,select,textarea):focus-visible{outline:2px solid var(--focus); outline-offset:2px}

  /* ---------- list ---------- */
  .list{display:flex; flex-direction:column; gap:7px; margin-top:12px}
  .grouphead{
    font-family:"Noto Kufi Arabic",sans-serif; font-size:12.5px; color:var(--ink-3);
    margin:14px 2px 2px; letter-spacing:.02em;
  }
  .grouphead:first-child{margin-top:2px}

  .row{
    background:var(--surface); border:1px solid var(--line-soft); border-radius:12px;
    padding:10px 12px; display:grid; gap:9px; box-shadow:var(--shadow);
    border-inline-start:3px solid transparent;
  }
  .row.done{border-inline-start-color:var(--book); background:var(--surface-2)}
  .row.part{border-inline-start-color:var(--work)}
  .row.away{border-inline-start-color:var(--away)}
  .row.away .name{color:var(--ink-2)}

  .who{display:flex; align-items:baseline; gap:9px; min-width:0}
  .idx{
    font-variant-numeric:tabular-nums; font-size:12px; color:var(--ink-3);
    min-width:22px; text-align:center; border:1px solid var(--line-soft);
    border-radius:6px; padding:1px 4px; flex:0 0 auto; align-self:center;
  }
  .name{font-size:15.5px; font-weight:500; line-height:1.35; overflow-wrap:anywhere}
  .meta{font-size:11.5px; color:var(--ink-3); margin-top:2px; font-variant-numeric:tabular-nums}
  .meta.note{color:var(--warn)}

  .acts{display:grid; grid-template-columns:1fr 1fr auto auto; gap:7px}
  .chip{
    min-width:0; min-height:42px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-2); font:inherit; font-size:13.5px; font-weight:500;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; padding:0 10px;
    transition:background .12s ease, border-color .12s ease, color .12s ease;
  }
  .chip .tick{width:15px; text-align:center; font-size:13px; opacity:.35}
  .chip[aria-pressed="true"] .tick{opacity:1}
  .chip.b[aria-pressed="true"]{background:var(--book-bg); border-color:var(--book); color:var(--book); font-weight:600}
  .chip.w[aria-pressed="true"]{background:var(--work-bg); border-color:var(--work); color:var(--work); font-weight:600}
  .chip.x[aria-pressed="true"]{background:var(--away-bg); border-color:var(--away); color:var(--away); font-weight:600}
  .chip.n.has{background:var(--away-bg); border-color:var(--away); color:var(--away)}
  @media (hover:hover){.chip:hover{border-color:var(--ink-3)}}

  @media (min-width:640px){
    .row{grid-template-columns:minmax(0,1fr) auto; align-items:center; padding:8px 12px}
    .who{grid-column:1}
    .acts{grid-column:2; grid-template-columns:138px 138px auto auto}
    .noteline{grid-column:1 / -1}
    .chip{min-height:38px; font-size:13px}
  }

  .noteline{display:none; gap:7px}
  .noteline.open{display:flex}
  .noteline input{
    flex:1; min-width:0; border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
    border-radius:9px; padding:8px 11px; font:inherit; font-size:13.5px;
  }

  .empty{text-align:center; color:var(--ink-3); padding:40px 12px; font-size:14px}

  /* ---------- footer bar ---------- */
  .footbar{
    position:fixed; inset-inline:0; bottom:0; z-index:40; display:flex; justify-content:center;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--paper) 62%,transparent);
    pointer-events:none;
  }
  .footinner{
    pointer-events:auto; display:flex; gap:7px; background:var(--surface);
    border:1px solid var(--line); border-radius:12px; padding:6px; box-shadow:var(--shadow);
  }
  .btn{
    border:0; background:transparent; color:var(--ink-2); font:inherit; font-size:13px;
    padding:8px 12px; border-radius:8px; cursor:pointer; white-space:nowrap;
  }
  @media (hover:hover){.btn:hover{background:var(--surface-2); color:var(--ink)}}
  .btn.primary{background:var(--book); color:#fff; font-weight:600}
  @media (hover:hover){.btn.primary:hover{background:var(--book); filter:brightness(1.08); color:#fff}}

  .banner{
    background:var(--away-bg); color:var(--warn); border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
    border-radius:10px; padding:9px 12px; font-size:12.5px; margin:10px 0 0;
  }

  /* ---------- print ---------- */
  .printonly{display:none}
  @media print{
    @page{size:A4; margin:14mm}
    body{background:#fff; color:#000; font-size:11pt}
    .topbar,.footbar,.toolrow,.tabs,.acts .chip.n,.noteline,.banner{display:none !important}
    #app{max-width:none; padding:0}
    .list{display:none}
    .printonly{display:block}
    .psheet{page-break-after:always}
    .psheet:last-child{page-break-after:auto}
    .phead{text-align:center; margin-bottom:8mm}
    .phead h2{font-family:"Noto Kufi Arabic",sans-serif; font-size:15pt; margin:0 0 2mm}
    .phead div{font-size:10pt; color:#333}
    table.pt{width:100%; border-collapse:collapse; direction:rtl}
    table.pt th,table.pt td{border:.4pt solid #444; padding:2.2mm 2mm; font-size:10pt}
    table.pt th{background:#eee; font-weight:600}
    table.pt td.c{text-align:center; width:22mm}
    table.pt td.i{text-align:center; width:10mm}
    table.pt td.s{width:34mm}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
</style>

<div id="app">
  <div class="topbar">
    <div class="title-row">
      <div>
        <h1>سجل تسليم الكتب</h1>
        <div class="sub">كتاب الطالب وكتاب النشاط · الصفان التاسع والعاشر · 2026/2027م</div>
      </div>
      <div class="sync" id="sync">جارٍ الاتصال…</div>
    </div>

    <div class="meter">
      <div class="meter-top">
        <span id="meterLabel">اكتمل التسليم</span>
        <span><b id="doneN">0</b> <span id="totalN">/ 109</span></span>
      </div>
      <div class="bar"><span class="full" id="barFull" style="width:0%"></span><span class="part" id="barPart" style="width:0%"></span></div>
    </div>

    <div class="stats">
      <span><span class="dot" style="background:var(--book)"></span> الكتابان <i id="sDone">0</i></span>
      <span><span class="dot" style="background:var(--work)"></span> جزئي <i id="sPart">0</i></span>
      <span><span class="dot" style="background:var(--line)"></span> لم يستلم <i id="sNone">0</i></span>
      <span><span class="dot" style="background:var(--away)"></span> غائب <i id="sAway">0</i></span>
    </div>

    <div class="tabs" id="tabs" role="tablist"></div>

    <div class="toolrow">
      <input class="search" id="q" type="search" placeholder="ابحث باسم الطالب…" autocomplete="off">
      <div class="selwrap">
        <select class="filter" id="filter" aria-label="تصفية">
          <option value="all">الكل</option>
          <option value="pending">لم يستلم بعد</option>
          <option value="part">استلام جزئي</option>
          <option value="done">استلم الكتابين</option>
          <option value="away">الغائبون</option>
          <option value="notes">لها ملاحظات</option>
        </select>
      </div>
    </div>
  </div>

  <div id="banner"></div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>لا يوجد طلاب مطابقون لهذا البحث.</div>
  <div class="printonly" id="print"></div>
</div>

<div class="footbar">
  <div class="footinner">
    <button class="btn" id="addBtn">إضافة طالب</button>
    <button class="btn" id="csvBtn" hidden>تصدير CSV</button>
    <button class="btn primary" id="printBtn">طباعة كشف التوقيع</button>
  </div>
</div>

16","n":16,"name":"عبدالله بن فايل بن عبيد الساعدي"},{"id":"g10-2-17","n":17,"name":"عبدالله بن سالم بن محمد الساعدي"},{"id":"g10-2-18","n":18,"name":"عبدالله بن سعيد بن عبدالله الحربي"},{"id":"g10-2-19","n":19,"name":"علي بن خميس بن صالح العريمي"},{"id":"g10-2-20","n":20,"name":"علي بن راشد بن عبدالله الحربي"},{"id":"g10-2-21","n":21,"name":"علي بن محمد بن علي الروتلي"},{"id":"g10-2-22","n":22,"name":"علي بن محمد بن مصبح الساعدي"},{"id":"g10-2-23","n":23,"name":"غيث بن خميس بن عبدالله الحربي"},{"id":"g10-2-24","n":24,"name":"غيث بن سالم بن علي الساعدي"},{"id":"g10-2-25","n":25,"name":"مترف بن محمد بن احمد الساعدي"},{"id":"g10-2-26","n":26,"name":"محمد بن علي بن سعود الساعدي"},{"id":"g10-2-27","n":27,"name":"محمد بن خميس بن شغيل الحربي"},{"id":"g10-2-28","n":28,"name":"محمد بن خميس بن محمد العريمي"},{"id":"g10-2-29","n":29,"name":"محمد بن سعيد بن عبدالله الساعدي"},{"id":"g10-2-30","n":30,"name":"مسلم بن صالح بن خميس الساعدي"},{"id":"g10-2-31","n":31,"name":"مكتوم بن راشد بن عبدالله الساعدي"},{"id":"g10-2-32","n":32,"name":"نايف بن أحمد بن جمعه الساعدي"},{"id":"g10-2-33","n":33,"name":"هادي بن سعيد بن جمعه الساعدي"}]}];
  var STANDALONE = true;

  /* ---------- roster index ---------- */
  var STUDENTS = [];
  CLASSES.forEach(function(c){
    c.students.forEach(function(s){
      STUDENTS.push({id:s.id, n:s.n, name:s.name, cls:c.id, clsLabel:c.label, extra:false});
    });
  });
  var extras = [];          // added later, from db
  var state  = {};          // id -> {b,a,x,note,t}
  var db = null, downloads = null;
  var LS = "book-handover-v1";

  function all(){ return STUDENTS.concat(extras); }
  function st(id){ return state[id] || {b:0,a:0,x:0,note:"",t:""}; }

  function norm(s){
    return String(s||"")
      .replace(/[ـً-ْٰ]/g,"")
      .replace(/[آأإٱ]/g,"ا")
      .replace(/ة/g,"ه")
      .replace(/[ى]/g,"ي")
      .replace(/\s+/g," ").trim();
  }
  all().forEach(function(s){ s.key = norm(s.name); });

  function statusOf(s){
    var r = st(s.id);
    if (r.b && r.a) return "done";
    if (r.x) return "away";
    if (r.b || r.a) return "part";
    return "pending";
  }

  /* ---------- persistence ---------- */
  function saveLocal(){
    try{ localStorage.setItem(LS, JSON.stringify({state:state, extras:extras})); }catch(e){}
  }
  function loadLocal(){
    try{
      var raw = localStorage.getItem(LS); if(!raw) return;
      var o = JSON.parse(raw);
      if(o && o.state) state = o.state;
      if(o && o.extras) { extras = o.extras; extras.forEach(function(s){ s.key = norm(s.name); }); }
    }catch(e){}
  }

  var pending = {};
  var flushTimer = null;
  function push(id){
    if(!db){ saveLocal(); return; }
    pending[id] = true;
    if(flushTimer) return;
    flushTimer = setTimeout(function(){
      flushTimer = null;
      var ids = Object.keys(pending); pending = {};
      ids.forEach(function(i){
        var r = st(i);
        db.doc("records/"+i).set({b:r.b?1:0, a:r.a?1:0, x:r.x?1:0, note:r.note||"", t:r.t||""})
          .catch(function(e){ setSync("warn","تعذّر الحفظ"); });
      });
    }, 220);
  }

  function setSync(kind, text){
    var el = document.getElementById("sync");
    el.className = "sync" + (kind ? " "+kind : "");
    el.textContent = text;
  }

  /* ---------- mutations ---------- */
  function toggle(id, field){
    var r = Object.assign({b:0,a:0,x:0,note:"",t:""}, st(id));
    r[field] = r[field] ? 0 : 1;
    if(field !== "x" && (r.b || r.a)) r.x = 0;
    if(field === "x" && r.x){ /* keep books as-is */ }
    r.t = (r.b || r.a) ? new Date().toISOString() : "";
    state[id] = r; saveLocal(); push(id); paint(id); stats();
  }
  function setNote(id, txt){
    var r = Object.assign({b:0,a:0,x:0,note:"",t:""}, st(id));
    r.note = txt; state[id] = r; saveLocal(); push(id); paint(id); stats();
  }

  /* ---------- rendering ---------- */
  var tabState = "all", filterState = "all", query = "";
  var rows = {};   // id -> element refs

  function timeText(iso){
    if(!iso) return "";
    var d = new Date(iso); if(isNaN(d)) return "";
    var day = d.toLocaleDateString("ar-OM-u-nu-latn",{day:"numeric",month:"long"});
    var t = d.toLocaleTimeString("ar-OM-u-nu-latn",{hour:"2-digit",minute:"2-digit",hour12:false});
    return day + " · " + t;
  }

  function buildRow(s){
    var row = document.createElement("div"); row.className = "row";

    var who = document.createElement("div"); who.className = "who";
    var idx = document.createElement("span"); idx.className = "idx"; idx.textContent = s.n;
    var box = document.createElement("div"); box.style.minWidth = "0";
    var nm  = document.createElement("div"); nm.className = "name"; nm.textContent = s.name;
    var meta= document.createElement("div"); meta.className = "meta";
    box.appendChild(nm); box.appendChild(meta);
    who.appendChild(idx); who.appendChild(box);

    var acts = document.createElement("div"); acts.className = "acts";
    function mk(cls, label, title){
      var b = document.createElement("button");
      b.className = "chip " + cls; b.type = "button"; b.setAttribute("aria-pressed","false");
      if(title) b.title = title;
      var tk = document.createElement("span"); tk.className = "tick"; tk.textContent = "✓";
      var tx = document.createElement("span"); tx.textContent = label;
      if(cls === "n" || cls === "x"){ b.appendChild(tx); } else { b.appendChild(tk); b.appendChild(tx); }
      acts.appendChild(b); return b;
    }
    var bB = mk("b","كتاب الطالب");
    var bW = mk("w","كتاب النشاط");
    var bX = mk("x","غائب","تعليم الطالب كغائب");
    var bN = mk("n","ملاحظة","إضافة ملاحظة");

    var nl = document.createElement("div"); nl.className = "noteline";
    var ni = document.createElement("input"); ni.type = "text"; ni.placeholder = "ملاحظة (مثال: سيستلم غدًا)"; ni.maxLength = 120;
    nl.appendChild(ni);

    row.appendChild(who); row.appendChild(acts); row.appendChild(nl);

    bB.addEventListener("click", function(){ toggle(s.id,"b"); });
    bW.addEventListener("click", function(){ toggle(s.id,"a"); });
    bX.addEventListener("click", function(){ toggle(s.id,"x"); });
    bN.addEventListener("click", function(){
      nl.classList.toggle("open");
      if(nl.classList.contains("open")) ni.focus();
    });
    var t2 = null;
    ni.addEventListener("input", function(){
      clearTimeout(t2);
      t2 = setTimeout(function(){ setNote(s.id, ni.value.trim()); }, 500);
    });

    rows[s.id] = {row:row, meta:meta, b:bB, w:bW, x:bX, n:bN, note:nl, input:ni, s:s};
    return row;
  }

  function matches(s){
    if(tabState !== "all" && s.cls !== tabState) return false;
    if(query && s.key.indexOf(query) === -1) return false;
    if(filterState === "all") return true;
    if(filterState === "notes") return !!st(s.id).note;
    return statusOf(s) === filterState;
  }

  function paint(id){
    var r = rows[id]; if(!r) return;
    var v = st(id), s = r.s, status = statusOf(s);
    r.row.className = "row" + (status === "done" ? " done" : status === "part" ? " part" : status === "away" ? " away" : "");
    r.b.setAttribute("aria-pressed", v.b ? "true" : "false");
    r.w.setAttribute("aria-pressed", v.a ? "true" : "false");
    r.x.setAttribute("aria-pressed", v.x ? "true" : "false");
    r.n.className = "chip n" + (v.note ? " has" : "");
    if(document.activeElement !== r.input && r.input.value !== (v.note||"")) r.input.value = v.note || "";
    if(v.note && !r.note.classList.contains("open")) r.note.classList.add("open");
    if(v.note){ r.meta.className = "meta note"; r.meta.textContent = v.note; }
    else if(v.x){ r.meta.className = "meta"; r.meta.textContent = "غائب"; }
    else if(v.t){ r.meta.className = "meta"; r.meta.textContent = timeText(v.t); }
    else { r.meta.textContent = ""; }
    r.row.hidden = !matches(s);
  }

  function renderList(){
    var list = document.getElementById("list");
    list.textContent = ""; rows = {};
    var pool = all();
    var byCls = {};
    pool.forEach(function(s){ (byCls[s.cls] = byCls[s.cls] || []).push(s); });
    CLASSES.forEach(function(c){
      var arr = byCls[c.id] || [];
      if(!arr.length) return;
      if(tabState !== "all" && tabState !== c.id) return;
      var h = document.createElement("div"); h.className = "grouphead";
      h.textContent = "الصف " + c.label;
      h.dataset.cls = c.id;
      list.appendChild(h);
      arr.forEach(function(s){ list.appendChild(buildRow(s)); });
    });
    Object.keys(rows).forEach(paint);
    visibility();
  }

  function visibility(){
    var list = document.getElementById("list");
    var shown = 0;
    CLASSES.forEach(function(c){
      var head = list.querySelector('.grouphead[data-cls="'+c.id+'"]');
      if(!head) return;
      var any = all().some(function(s){ return s.cls === c.id && rows[s.id] && !rows[s.id].row.hidden; });
      head.hidden = !any; if(any) shown++;
    });
    var anyRow = Object.keys(rows).some(function(k){ return !rows[k].row.hidden; });
    document.getElementById("empty").hidden = anyRow;
  }

  function stats(){
    var pool = all(), d=0,p=0,a=0,none=0;
    pool.forEach(function(s){
      var k = statusOf(s);
      if(k==="done") d++; else if(k==="part") p++; else if(k==="away") a++; else none++;
    });
    var total = pool.length;
    document.getElementById("doneN").textContent = d;
    document.getElementById("totalN").textContent = "/ " + total;
    document.getElementById("sDone").textContent = d;
    document.getElementById("sPart").textContent = p;
    document.getElementById("sNone").textContent = none;
    document.getElementById("sAway").textContent = a;
    document.getElementById("barFull").style.width = (total? d/total*100:0) + "%";
    document.getElementById("barPart").style.width = (total? p/total*100:0) + "%";
    CLASSES.forEach(function(c){
      var el = document.querySelector('.tab[data-cls="'+c.id+'"] .frac');
      if(!el) return;
      var arr = all().filter(function(s){ return s.cls===c.id; });
      var dd = arr.filter(function(s){ return statusOf(s)==="done"; }).length;
      el.textContent = dd + "/" + arr.length;
    });
    var elAll = document.querySelector('.tab[data-cls="all"] .frac');
    if(elAll) elAll.textContent = d + "/" + total;
    visibility();
  }

  /* ---------- tabs ---------- */
  function renderTabs(){
    var box = document.getElementById("tabs"); box.textContent = "";
    var defs = [{id:"all", label:"كل الصفوف"}].concat(CLASSES.map(function(c){ return {id:c.id, label:"الصف "+c.label}; }));
    defs.forEach(function(d){
      var t = document.createElement("button");
      t.className = "tab"; t.type = "button"; t.setAttribute("role","tab");
      t.dataset.cls = d.id;
      t.setAttribute("aria-selected", d.id===tabState ? "true":"false");
      var b = document.createElement("b"); b.textContent = d.label;
      var f = document.createElement("span"); f.className = "frac"; f.textContent = "";
      t.appendChild(b); t.appendChild(f);
      t.addEventListener("click", function(){
        tabState = d.id;
        Array.prototype.forEach.call(box.children, function(x){ x.setAttribute("aria-selected", x.dataset.cls===tabState?"true":"false"); });
        renderList(); stats();
        window.scrollTo({top:0, behavior:"instant" in window ? "auto":"auto"});
      });
      box.appendChild(t);
    });
  }

  /* ---------- print sheet ---------- */
  function buildPrint(){
    var box = document.getElementById("print"); box.textContent = "";
    var list = CLASSES.filter(function(c){ return tabState==="all" || c.id===tabState; });
    list.forEach(function(c){
      var arr = all().filter(function(s){ return s.cls===c.id; })
                     .sort(function(x,y){ return x.n-y.n; });
      if(!arr.length) return;
      var sheet = document.createElement("div"); sheet.className = "psheet";
      var head = document.createElement("div"); head.className = "phead";
      var h2 = document.createElement("h2"); h2.textContent = "كشف تسليم الكتب — الصف " + c.label;
      var sd = document.createElement("div"); sd.textContent = "كتاب الطالب وكتاب النشاط · العام الدراسي 2026/2027م";
      head.appendChild(h2); head.appendChild(sd); sheet.appendChild(head);
      var tb = document.createElement("table"); tb.className = "pt";
      var thead = document.createElement("thead");
      var tr = document.createElement("tr");
      ["م","الاسم","كتاب الطالب","كتاب النشاط","التوقيع","ملاحظات"].forEach(function(x){
        var th = document.createElement("th"); th.textContent = x; tr.appendChild(th);
      });
      thead.appendChild(tr); tb.appendChild(thead);
      var tbody = document.createElement("tbody");
      arr.forEach(function(s){
        var v = st(s.id);
        var r = document.createElement("tr");
        function td(txt, cls){ var d = document.createElement("td"); if(cls) d.className = cls; d.textContent = txt; r.appendChild(d); }
        td(s.n,"i"); td(s.name);
        td(v.b?"✓":"", "c"); td(v.a?"✓":"", "c"); td("", "s");
        td(v.note || (v.x ? "غائب" : ""));
        tbody.appendChild(r);
      });
      tb.appendChild(tbody); sheet.appendChild(tb); box.appendChild(sheet);
    });
  }

  /* ---------- CSV ---------- */
  function csv(){
    var lines = [["الصف","م","الاسم","كتاب الطالب","كتاب النشاط","غائب","وقت التسليم","ملاحظات"]];
    all().sort(function(a,b){ return a.cls===b.cls ? a.n-b.n : 0; }).forEach(function(s){
      var v = st(s.id);
      lines.push([s.clsLabel, s.n, s.name, v.b?"نعم":"لا", v.a?"نعم":"لا", v.x?"نعم":"لا", v.t?timeText(v.t):"", v.note||""]);
    });
    return "﻿" + lines.map(function(r){
      return r.map(function(c){ return '"' + String(c).replace(/"/g,'""') + '"'; }).join(",");
    }).join("\r\n");
  }

  /* ---------- add student ---------- */
  function addStudent(){
    var name = window.prompt("اسم الطالب الجديد:");
    if(!name || !name.trim()) return;
    name = name.trim();
    var cid = tabState !== "all" ? tabState : null;
    if(!cid){
      var opts = CLASSES.map(function(c,i){ return (i+1)+" = "+c.label; }).join("   ");
      var pick = window.prompt("اختر الصف:\n" + opts, "1");
      var i = parseInt(pick,10) - 1;
      if(isNaN(i) || !CLASSES[i]) return;
      cid = CLASSES[i].id;
    }
    var c = CLASSES.filter(function(x){ return x.id===cid; })[0];
    var n = all().filter(function(s){ return s.cls===cid; }).length + 1;
    var id = cid + "-x" + Date.now().toString(36).slice(-5);
    var rec = {id:id, n:n, name:name, cls:cid, clsLabel:c.label, extra:true, key:norm(name)};
    extras.push(rec); saveLocal();
    if(db) db.doc("extra/"+id).set({name:name, cls:cid, n:n}).catch(function(){ setSync("warn","تعذّر الحفظ"); });
    tabState = cid;
    Array.prototype.forEach.call(document.getElementById("tabs").children, function(x){
      x.setAttribute("aria-selected", x.dataset.cls===tabState?"true":"false");
    });
    renderList(); stats();
  }

  /* ---------- wire up ---------- */
  loadLocal();
  renderTabs(); renderList(); stats();

  document.getElementById("q").addEventListener("input", function(e){
    query = norm(e.target.value);
    Object.keys(rows).forEach(function(id){ rows[id].row.hidden = !matches(rows[id].s); });
    visibility();
  });
  document.getElementById("filter").addEventListener("change", function(e){
    filterState = e.target.value;
    Object.keys(rows).forEach(function(id){ rows[id].row.hidden = !matches(rows[id].s); });
    visibility();
  });
  document.getElementById("printBtn").addEventListener("click", function(){
    buildPrint(); window.print();
  });
  document.getElementById("addBtn").addEventListener("click", addStudent);
  document.getElementById("csvBtn").addEventListener("click", function(){
    var data = csv();
    if(downloads){ downloads.save({filename:"تسليم-الكتب.csv", data:data}).catch(function(){}); return; }
    var url = URL.createObjectURL(new Blob([data], {type:"text/csv;charset=utf-8"}));
    var a = document.createElement("a"); a.href = url; a.download = "تسليم-الكتب.csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  });

  /* ---------- capabilities ---------- */
  if(STANDALONE){
    setSync("", "محفوظ على هذا الجهاز");
    document.getElementById("csvBtn").hidden = false;
    return;
  }
  setSync("", "جارٍ الاتصال…");

  (window.claude && claude.use ? claude.use("db") : Promise.resolve(null)).then(function(x){
    if(!x){
      db = null;
      setSync("warn","محفوظ على هذا الجهاز");
      document.getElementById("banner").innerHTML =
        '<div class="banner">لم يتم الاتصال بقاعدة البيانات المشتركة، والبيانات محفوظة على هذا المتصفح فقط. أعِد تحميل الصفحة للمزامنة.</div>';
      return;
    }
    db = x;
    setSync("ok","متزامن");

    db.collection("extra").onSnapshot(function(snap){
      var seen = {};
      snap.docs.forEach(function(d){
        var v = d.data() || {}; seen[d.id] = true;
        if(!extras.some(function(e){ return e.id===d.id; })){
          var c = CLASSES.filter(function(x){ return x.id===v.cls; })[0];
          if(!c) return;
          extras.push({id:d.id, n:v.n||99, name:v.name||"", cls:v.cls, clsLabel:c.label, extra:true, key:norm(v.name)});
        }
      });
      extras = extras.filter(function(e){ return seen[e.id]; });
      saveLocal(); renderList(); stats();
    }, function(){ setSync("warn","انقطعت المزامنة"); });

    db.collection("records").onSnapshot(function(snap){
      snap.docs.forEach(function(d){
        var v = d.data() || {};
        state[d.id] = {b:v.b?1:0, a:v.a?1:0, x:v.x?1:0, note:v.note||"", t:v.t||""};
      });
      snap.docChanges().forEach(function(ch){
        if(ch.type === "removed") delete state[ch.doc.id];
      });
      saveLocal();
      Object.keys(rows).forEach(paint);
      stats();
      setSync("ok", snap.metadata.fromCache ? "غير متصل مؤقتًا" : "متزامن");
    }, function(){ setSync("warn","انقطعت المزامنة"); });
  });

  (window.claude && claude.use ? claude.use("downloads") : Promise.resolve(null)).then(function(x){
    downloads = x;
    if(x) document.getElementById("csvBtn").hidden = false;
  });
})();
</script>
